name: Refresh TF1 schedule daily

# Toutes les nuits à 4h05 UTC (≈ 6h05 heure Paris en été, 5h05 en hiver).
# La grille TF1 est généralement publiée la veille au soir.
on:
  schedule:
    - cron: "5 4 * * *"
  # Permet de déclencher à la main depuis l'onglet Actions de GitHub.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch TF1 schedule
        run: node scripts/fetch-tf1.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain public/data/tf1.json)" ]]; then
            git add public/data/tf1.json
            git commit -m "data: refresh TF1 schedule ($(date -u +'%Y-%m-%d'))"
            git push
            echo "TF1 schedule updated."
          else
            echo "No change."
          fi
