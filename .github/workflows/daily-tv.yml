name: Refresh TV schedule daily (5 channels)

# Tous les jours à 4h05 UTC (≈ 6h05 heure Paris en été).
on:
  schedule:
    - cron: "5 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch TV prime-time (TF1, France 2, France 5, Arte, M6)
        run: node scripts/fetch-tv-tonight.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain public/data/tv-tonight.json)" ]]; then
            git add public/data/tv-tonight.json
            git commit -m "data: refresh TV schedule ($(date -u +'%Y-%m-%d'))"
            git push
            echo "TV schedule updated."
          else
            echo "No change."
          fi
