name: Refresh Dole events weekly

# Tous les lundis à 5h30 UTC (≈ 7h30 heure Paris en été, 6h30 en hiver).
# Choix du lundi pour que la TV ait les nouveaux événements de la semaine
# dès le début de la semaine commerciale.
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Dole events
        run: node scripts/fetch-dole-events.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain public/data/dole-events.json)" ]]; then
            git add public/data/dole-events.json
            git commit -m "data: refresh Dole events ($(date -u +'%Y-%m-%d'))"
            git push
            echo "Dole events updated."
          else
            echo "No change."
          fi
